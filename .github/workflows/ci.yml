name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Validate required app files
        shell: bash
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f manifest.webmanifest
          test -f sw.js
          grep -q "PawBudget" index.html
          grep -q "PawBudget" README.md
