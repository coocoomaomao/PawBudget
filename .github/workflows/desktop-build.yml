name: Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "electron/**"
      - "build/**"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Collect installer
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force -Path release-files | Out-Null
          $installer = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found" }
          $target = "release-files/PawBudget-Setup-v$version.exe"
          Copy-Item $installer.FullName -Destination $target
          Write-Host "Installer: $target"
          Get-ChildItem release-files

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PawBudget-Windows
          path: release-files/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $asset = "release-files/PawBudget-Setup-v$version.exe"
          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag $asset --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $asset `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "PawBudget 毛球账本 v$version" `
              --notes "Windows 安装版。双击 EXE 安装即可使用。数据与照片默认保存在本机。"
          }
