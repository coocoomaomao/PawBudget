name: Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "electron/**"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-files | Out-Null
          Get-ChildItem -Path dist -Filter "*.exe" | ForEach-Object {
            Copy-Item $_.FullName -Destination release-files
          }
          Get-ChildItem release-files

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PawBudget-Windows-v0.1.4
          path: release-files/*.exe
          if-no-files-found: error
          retention-days: 30
